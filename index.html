<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visor 3D · Proyecto</title><style>*{box-sizing:border-box}body{margin:0;background:#171b1c;color:#fff;font:14px system-ui,sans-serif}model-viewer{width:100vw;height:100dvh;background:radial-gradient(ellipse at center,#353c3e,#171b1c)}.info{position:fixed;left:18px;bottom:18px;padding:11px 15px;background:#15191bcc;border:1px solid #ffffff22;border-radius:10px;pointer-events:none} .err{position:fixed;top:18px;left:18px;background:#8b2525;padding:12px;border-radius:8px;display:none}</style><script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script></head><body><model-viewer src="./modelo.glb" alt="Modelo tridimensional del proyecto" camera-controls auto-rotate shadow-intensity="1" exposure="1" interaction-prompt="auto" ar ar-modes="webxr scene-viewer quick-look" loading="eager"><div slot="poster" style="display:grid;place-items:center;height:100%">Cargando modelo 3D…</div></model-viewer><div class="info">Arrastra para girar · Rueda o pellizca para acercar · Botón derecho para desplazar</div><div id="error" class="err">No se pudo cargar modelo.glb. Comprueba que esté junto a index.html.</div><script>document.querySelector('model-viewer').addEventListener('error',()=>document.getElementById('error').style.display='block')</script></body></html>
